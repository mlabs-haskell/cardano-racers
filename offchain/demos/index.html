<!doctype html>
<html lang="en" data-framework="purescript">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <style>
    body {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
     

    /* Style for the card container */
    .wallet-card {
      border: 1px solid #ccc;
      border-radius: 5px;
      padding: 10px;
      margin: 10px;
      box-sizing: border-box;
      width: 100%;
      max-width: 300px;
      display: inline-block;
      vertical-align: top;
    }

    .wallet-card p {
      overflow-wrap: break-word;
    }

    /* Style for the balance table */
    .wallet-card table {
      border-collapse: collapse;
      margin-top: 10px;
      width: 100%;
    }

    .wallet-card table th,
    .wallet-card table td {
      padding: 5px;
      text-align: left;
    }

    .wallet-card table th {
      background-color: #f2f2f2;
    }

    /* Responsive grid for the cards */
    @media only screen and (min-width: 768px) {
      .wallet-card {
        max-width: calc(24% - 20px);
        margin: 10px;
        width: calc(24% - 20px);
      }
    }
  </style>
</head>
<body>
  <script type="module" src="./bundle.js"></script>
    <h2>Cardano Racers Nitro Demo</h2>
  <div>
    <button id="refresh-wallets" >Refresh Wallets</button>
    <button id="refresh-state" >Refresh State</button>
  </div>
  <div id="wallets">
    <div class="wallet-card">
      <h2>Actor: Admin</h2>
      <p>Address: addr_test1</p>
      <table>
        <thead>
          <tr>
            <th>Asset</th>
            <th>Value</th>
          </tr>
        </thead>
        <tbody id="balance-table-body">
          <tr>
            <td>ETH</td>
            <td id="eth-balance">200</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div>
    <p id="state"></p>
  </div>

  <div>
    <h4>Actions</h4>
    <button id="init" >Initialise Nitro</button>
    <button id="modify-price" >Change Nitro Price</button>
    <button id="mint-admin" >Admin Mint nitro</button>
    <button id="mint-bot" >Bot Mint Nitro</button>
    <button id="buy" >Buy Nitro</button>
  </div>
</body>
</html>
